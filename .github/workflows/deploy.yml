# Deploys to the personal Vercel account with a token, because Vercel's Git
# integration credits pushes to whichever Vercel account holds the GitHub
# login, and that is the work account.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_qPSywcNIMCdIP7PTChCW4HOL
  VERCEL_PROJECT_ID: prj_f0aGMcLYcHnpgUneuOCccBkzd2Zp

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test

      - name: Pull production settings
        run: pnpm dlx vercel@66.6.0 pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: pnpm dlx vercel@66.6.0 build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: pnpm dlx vercel@66.6.0 deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
